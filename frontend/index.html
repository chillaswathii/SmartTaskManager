<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430; --paper:#EEF1F5; --card:#fff; --line:#D8DEE6; --muted:#5B6675;
  --accent:#3F51D6; --hi:#C2255C; --mid:#D9930D; --lo:#2F8F73;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
h2{margin:0 0 12px;font-size:1.05rem}
input[type=text],input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #9AA6F5;outline-offset:2px}
.search{width:min(320px,100%)}
.grid{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.side{display:grid;gap:24px}

/* the one bold element: what to do now */
.next{background:var(--ink);color:#fff;border-radius:14px;padding:24px;margin-bottom:24px}
.next .label{margin:0;color:#AAB4C3;font-size:.9rem}
.next .title{margin:6px 0 16px;font-size:1.9rem;font-weight:700;line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
.next .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.next .done-msg{font-size:1.2rem;margin:6px 0 0}

button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px}
button:hover{background:#F6F8FA}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:#3445BF}
.next button.primary{background:#fff;color:var(--ink);border-color:#fff}
.next button.primary:hover{background:#E6EAF0}
button.danger{color:#A61E4D}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{border-radius:999px;padding:5px 14px;font-size:.92rem}
.tabs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.task .name{font-weight:600;overflow-wrap:anywhere}
.task .meta{color:var(--muted);font-size:.88rem}
.task.done .name{text-decoration:line-through;color:var(--muted)}
.task.done .pips i.on{background:#B7C0CC}
.actions{display:flex;gap:6px}
.actions button{padding:5px 10px;font-size:.9rem}

.pips{display:flex;gap:3px;align-items:flex-end;height:26px}
.pips i{display:block;width:6px;border-radius:2px;background:#E1E6EC}
.pips i:nth-child(1){height:8px}.pips i:nth-child(2){height:12px}.pips i:nth-child(3){height:16px}
.pips i:nth-child(4){height:21px}.pips i:nth-child(5){height:26px}
.pips.hi i.on{background:var(--hi)}.pips.mid i.on{background:var(--mid)}.pips.lo i.on{background:var(--lo)}
.next .pips i{background:#3A4656}
.next .pips.hi i.on{background:#FF6B9A}.next .pips.mid i.on{background:#F5B83D}.next .pips.lo i.on{background:#5FD1AE}

form{display:grid;gap:12px}
label,.field-label{font-weight:600;font-size:.95rem}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale span{display:block;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.scale input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.scale input:focus-visible+span{outline:3px solid #9AA6F5;outline-offset:2px}
.hint{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left}
.stats b{display:block;font-size:1.6rem;line-height:1.1}
.stats span{color:var(--muted);font-size:.88rem}
.bar{height:8px;background:#E1E6EC;border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar div{height:100%;background:var(--lo);width:0;transition:width .3s}

.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
#msg{min-height:1.4em;margin:0 0 12px;font-size:.95rem}
#msg.err{color:#A61E4D;background:#FDECF2;border:1px solid #F3B7CD;border-radius:8px;padding:8px 12px}
#msg.ok{color:#1F6F57}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Smart Task Manager</h1>
    <input class="search" id="search" type="search" placeholder="Search by name or task ID" aria-label="Search tasks">
  </header>

  <p id="msg" role="status" aria-live="polite"></p>

  <div class="grid">
    <main>
      <section class="next" id="next" aria-label="Next task"></section>

      <div class="tabs" id="tabs" role="group" aria-label="Filter tasks">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="pending" aria-pressed="false">Pending</button>
        <button data-f="completed" aria-pressed="false">Completed</button>
      </div>
      <ul class="list" id="list"></ul>
    </main>

    <aside class="side">
      <section class="panel">
        <h2>Add a task</h2>
        <form id="add">
          <div>
            <label for="name">Task name</label>
            <input type="text" id="name" maxlength="100" required placeholder="Submit project report">
          </div>
          <div>
            <span class="field-label">Priority</span>
            <div class="scale" role="radiogroup" aria-label="Priority">
              <label><input type="radio" name="priority" value="1"><span>1</span></label>
              <label><input type="radio" name="priority" value="2"><span>2</span></label>
              <label><input type="radio" name="priority" value="3" checked><span>3</span></label>
              <label><input type="radio" name="priority" value="4"><span>4</span></label>
              <label><input type="radio" name="priority" value="5"><span>5</span></label>
            </div>
            <div class="hint"><span>Can wait</span><span>Do first</span></div>
          </div>
          <button class="primary" type="submit">Add task</button>
        </form>
      </section>

      <section class="panel">
        <h2>Progress</h2>
        <div class="stats">
          <div><b id="s-total">0</b><span>Total</span></div>
          <div><b id="s-done">0</b><span>Completed</span></div>
          <div><b id="s-pending">0</b><span>Pending</span></div>
        </div>
        <div class="bar" aria-hidden="true"><div id="s-bar"></div></div>
        <span class="hint" id="s-pct">No tasks yet</span>
      </section>
    </aside>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let tasks = [], filter = 'all', query = '';

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  el.append(...kids);
  return el;
}

async function api(path, opts) {
  let res;
  try { res = await fetch('/api' + path, opts); }
  catch { throw new Error('Cannot reach the server. Start ApiServer and open http://localhost:8080 in your browser.'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function say(text, kind = '') {
  const m = $('#msg');
  m.textContent = text;
  m.className = kind;
  if (kind === 'ok') setTimeout(() => { if (m.textContent === text) { m.textContent = ''; m.className = ''; } }, 2500);
}

const level = p => p >= 4 ? 'hi' : p === 3 ? 'mid' : 'lo';

function pips(p) {
  const el = h('div', { class: 'pips ' + level(p), title: 'Priority ' + p });
  for (let i = 1; i <= 5; i++) el.append(h('i', { class: i <= p ? 'on' : '' }));
  return el;
}

async function load() {
  try {
    const [list, stats, next] = await Promise.all([api('/tasks'), api('/analytics'), api('/next')]);
    tasks = list;
    renderStats(stats);
    renderNext(next);
    renderList();
    if ($('#msg').className === 'err') say('');
  } catch (e) { say(e.message, 'err'); }
}

function renderStats(s) {
  $('#s-total').textContent = s.total;
  $('#s-done').textContent = s.completed;
  $('#s-pending').textContent = s.pending;
  const pct = s.total ? Math.round(s.completed / s.total * 100) : 0;
  $('#s-bar').style.width = pct + '%';
  $('#s-pct').textContent = s.total ? pct + '% complete' : 'No tasks yet';
}

function renderNext(t) {
  const box = $('#next');
  box.replaceChildren();
  if (!t) {
    box.append(h('p', { class: 'label' }, 'Next up'),
      h('p', { class: 'done-msg' }, tasks.length ? 'Everything is done. Nice work.' : 'Add your first task to get started.'));
    return;
  }
  box.append(
    h('p', { class: 'label' }, 'Next up, highest priority'),
    h('p', { class: 'title' }, t.name),
    h('div', { class: 'row' },
      h('button', { class: 'primary', onclick: () => complete(t.id) }, 'Mark complete'),
      pips(t.priority),
      h('span', { class: 'label' }, 'Task #' + t.id + ', priority ' + t.priority)));
}

function renderList() {
  const ul = $('#list');
  ul.replaceChildren();
  const q = query.trim().toLowerCase();
  const rows = tasks
    .filter(t => filter === 'all' || (filter === 'completed') === (t.status === 'Completed'))
    .filter(t => !q || t.name.toLowerCase().includes(q) || String(t.id) === q.replace('#', ''))
    .sort((a, b) => (a.status === 'Completed') - (b.status === 'Completed') || b.priority - a.priority || a.id - b.id);

  if (!rows.length) {
    ul.append(h('li', { class: 'empty' },
      tasks.length ? 'No tasks match. Try another search or filter.' : 'No tasks yet. Add one using the form.'));
    return;
  }
  for (const t of rows) {
    const done = t.status === 'Completed';
    ul.append(h('li', { class: 'task' + (done ? ' done' : '') },
      pips(t.priority),
      h('div', {}, h('div', { class: 'name' }, t.name),
        h('div', { class: 'meta' }, '#' + t.id + ', priority ' + t.priority + ', ' + t.status.toLowerCase())),
      h('div', { class: 'actions' },
        done ? '' : h('button', { onclick: () => complete(t.id) }, 'Complete'),
        h('button', { class: 'danger', onclick: () => remove(t) }, 'Delete'))));
  }
}

async function complete(id) {
  try { await api('/tasks/' + id + '/complete', { method: 'POST' }); say('Task marked complete.', 'ok'); await load(); }
  catch (e) { say(e.message, 'err'); }
}

async function remove(t) {
  if (!confirm('Delete "' + t.name + '"?')) return;
  try { await api('/tasks/' + t.id, { method: 'DELETE' }); say('Task deleted.', 'ok'); await load(); }
  catch (e) { say(e.message, 'err'); }
}

$('#add').addEventListener('submit', async e => {
  e.preventDefault();
  const body = new URLSearchParams({
    name: $('#name').value,
    priority: document.querySelector('input[name=priority]:checked').value
  });
  try {
    await api('/tasks', { method: 'POST', body });
    $('#name').value = '';
    say('Task added.', 'ok');
    await load();
  } catch (err) { say(err.message, 'err'); }
});

$('#search').addEventListener('input', e => { query = e.target.value; renderList(); });
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
  renderList();
});

load();
</script>
</body>
</html>
